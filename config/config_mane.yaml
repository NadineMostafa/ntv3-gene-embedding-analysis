mode: mane
model_size: 650M
model_name: "NTv3_650M_pre" # or "NTv3_100M_pre"

paths:
  output:
    reports_dir: "../data/outputs/MANE_sequence_650M/reports"
    embeddings_path: "../data/outputs/MANE_sequence_650M/gene_embeddings.npy"
    ids_path: "../data/outputs/MANE_sequence_650M/gene_embeddings_ids.txt"
    manifest_path: "../data/outputs/MANE_sequence_650M/reports/manifest_mane.tsv"
    extracted_sequences_path: "../data/outputs/MANE_sequence_650M/reports/mane_sequences.fasta"
  input:
    gene_list_path: "../data/input/gene_list.txt"
    myc_list_path: "../data/input/myc_related_genes.txt"
    pou_list_path: "../data/input/pou_related_genes.txt"
    annotation_path: "../data/reference/gencode.v45.annotation.gtf"
    fasta_path: "../data/reference/gencode.v45.transcripts.fa"

embedding:
  max_tokens_per_batch: 120_000
  max_sequence_length: 120_000
  sequence_id_column: "transcript_id"
  length_column: "sequence_length_bp"
  use_bfloat16: true
  debug: true

umap:
  output_dir: "../data/outputs/MANE_sequence_650M/umap_output"
  n_neighbors: 15
  min_dist: 0.0
  n_components: 2
  metric: "cosine"
  seed: 42
  annotated_color: "red"
  default_color: "lightgray"
  annotation_strict: false
  annotation_sources:
    myc_list: "../data/input/myc_related_genes.txt"
    pou_list: "../data/input/pou_related_genes.txt"
